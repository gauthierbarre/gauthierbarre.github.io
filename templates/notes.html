{% extends "base.html" %}
{% block content %}
  <header class="page-head">
    <h1>Notes</h1>
  </header>
  <ul class="notes">
    {% for n in notes %}
    <li class="note">
      <p class="note-topic">{{ n.topic }}</p>
      <h3 class="card-title"><a href="{{ n.url if n.external else root ~ n.url }}"{% if n.external %} target="_blank" rel="noopener"{% endif %}>{{ n.title }}{% if n.external %} <span class="ext" aria-hidden="true">↗</span>{% endif %}</a></h3>
      {% if n.summary %}<p class="card-summary">{{ n.summary }}</p>{% endif %}
    </li>
    {% endfor %}
  </ul>
{% endblock %}
