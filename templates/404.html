{# GitHub serves 404.html from any URL depth, so this page uses absolute paths. #}
{% set root = site.base_path %}
{% extends "base.html" %}
{% block head_extra %}<meta name="robots" content="noindex">{% endblock %}
{% block content %}
  <section class="page split">
    <h1 class="split-side page-title">Not found</h1>
    <p class="split-main">The page you are looking for does not exist. <a href="{{ site.base_path }}">Back to the home page.</a></p>
  </section>
{% endblock %}
