{# Project entry. Expects `p` and `root`. #}
<article class="entry">
  <h3 class="entry-title"><a href="{{ root }}{{ p.url }}">{{ p.title }}</a>{% if p.draft %} <span class="draft">draft</span>{% endif %}</h3>
  <p class="entry-summary">{{ p.summary }}</p>
  <p class="entry-links">
    <span class="muted">{% if p.context %}{{ p.context }} · {% endif %}{{ p.date.year }}</span>
    <a href="{{ root }}{{ p.url }}">Read</a>
    {% if p.repo %}<a href="{{ p.repo }}" target="_blank" rel="noopener">Code ↗</a>{% endif %}
    {% if p.paper %}<a href="{{ p.paper }}" target="_blank" rel="noopener">Paper ↗</a>{% endif %}
  </p>
</article>
