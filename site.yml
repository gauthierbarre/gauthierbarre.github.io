description: >-
  Gauthier Barre — quantitative research on US equities: systematic signals net of
  costs, point-in-time data and S&P 500 composition reconstruction and prediction.

# Markdown allowed.
about: |
  I am a student in the AI for Markets and Quantitative Investment master (AI MaQI) at
  École Polytechnique and ENSAE, after the engineering programme of Télécom Paris, where I
  studied stochastic modelling and scientific computing, and time series and artificial
  intelligence.

  My projects are empirical questions on US equities, with an emphasis on getting the data
  right before drawing conclusions: point-in-time universes, survivorship-free histories,
  realistic transaction costs and honest baselines.

keywords:
