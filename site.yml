# ---------------------------------------------------------------------------
# Site identity. Everything on the home page and in the sidebar comes from here.
# Edit, then run `make build` (or just push: GitHub Actions rebuilds the site).
# ---------------------------------------------------------------------------

name: Gauthier Barre
# One or two short lines under the name in the sidebar.
tagline:
  - Quantitative finance
  - Research · systematic strategies
# Optional photo: put the file in static/ and give its name here (e.g. photo.jpg).
# Without a photo the sidebar shows the initials below.
photo:
initials: GB

url: https://gauthierbarre.github.io/portefolio/   # public URL, with trailing slash
base_path: /portefolio/                            # sub-path on GitHub Pages (used by 404.html)
lang: en
description: >-
  Gauthier Barre — quantitative research on US equities: systematic signals net of
  costs, point-in-time data and S&P 500 composition reconstruction and prediction.

# Markdown allowed.
about: >-
  I work on empirical questions in US equities, with an emphasis on getting the data
  right before drawing conclusions: point-in-time universes, survivorship-free histories,
  realistic transaction costs and honest baselines. I am looking for opportunities in
  quantitative research and quantitative development.

keywords:
  - Cross-sectional signals
  - Transaction costs
  - Point-in-time data
  - Index methodology
  - Backtesting
  - Machine learning in finance

# Shown in the "Contact" block of the home page. Leave empty to hide.
email:            # e.g. "gauthier dot barre at example dot com" (written out to deter scrapers)

# Sidebar icons. Supported icons: github, linkedin, x, email, scholar.
social:
  - { icon: github, url: "https://github.com/gauthierbarre" }
  # - { icon: linkedin, url: "https://www.linkedin.com/in/..." }

# Optional CV: drop a PDF in static/ (e.g. static/cv.pdf) and set its name here.
cv:

# Number of entries in the "Latest" block of the home page.
latest: 4
